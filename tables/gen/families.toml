# Families of air.* names. Every name of intrinsics.toml matches exactly one family's
# patterns (Python full match). decision is one of:
#   numerics            float math; the lowering is the numerics.toml row named in rows
#   native              a WGSL built-in or statement with the same definition
#   lowering            an exact WGSL implementation (integer emulation, memory model,
#                       executor-provided values) owned by the package named in owner
#   emulation           an exact emulation that the plan section named in plan describes
#   metadata            module or argument metadata decoded by S2; no WGSL code of its own
#   device-unsupported  a feature Apple's family tables place above the A10X's Apple3
#                       family; rejected as on device (the D1 profile is authoritative)
#   not-from-msl        a front-end name for a construct the MSL specification does not
#                       define and the system corpus does not use; Refusal if met
#   refusal             no exact WebGPU form; LOUD with the blocking clause
#   open                unresolved, with the reason
# probe lists measurement cases (tables/measure/air_probe.toml) whose emitted names are
# in the family, linking the MSL construct to the names.

# ---------------------------------------------------------------- numeric types

[[family]]
id = "double"
match = ['air\.(?:.*\.)?(?:v\d+)?f64(?:\..*)?', 'air\.double_type']
kind = "function"
msl = "double-precision forms"
decision = "refusal"
wgsl = "none"
reason = "MSL does not support the double type and WGSL has no 64-bit float; plan section 5.2 treats a module computing in double as malformed input. These names are front-end entries, and two system modules use them (question 5.2-double-in-corpus)."
cite = [
  { src = "msl", ref = "2.1", quote = "Metal does not support the double, long long, unsigned long long, and long double data types." },
  { src = "wgsl", ref = "#floating-point-types", absent = '\bf64\b' },
]

[[family]]
id = "bfloat"
match = ['air\.(?!(?:.*\.)?(?:v\d+)?f64(?:\.|$))(?!simdgroup_matrix)(?:.*\.)?(?:v\d+)?bf16(?:\..*)?', 'air\.bfloat_type']
kind = "function"
msl = "bfloat type and operations"
decision = "device-unsupported"
wgsl = "none"
reason = "Apple's family tables list the bfloat data type from Apple6; the A10X is Apple3."
cite = [
  { src = "mfst", quote = "MTLDataType.bfloat (brain float) scalar and vector cases Metal 3 & 4 Apple6" },
  { src = "mfst", quote = "A10-series Metal Apple3" },
]

# ---------------------------------------------------------------- math

[[family]]
id = "math-float"
match = ['air\.(?:fast_)?(?:acos|acosh|asin|asinh|atan|atan2|atanh|ceil|copysign|cos|cosh|cospi|divide|exp|exp2|exp10|fabs|fdim|floor|fma|fmax|fmax3|fmedian3|fmin|fmin3|fmod|fract|frexp|ilogb|ldexp|log|log2|log10|modf|nextafter|pow|powr|rint|round|rsqrt|sin|sincos|sinh|sinpi|sqrt|tan|tanh|tanpi|trunc|saturate|mix|smoothstep|step|sign)(?:\.(?:v\d+)?(?:f16|f32|i32|i16))*',
         'air\.(?:fast_)?clamp(?:\.(?:v\d+)?(?:f16|f32))*']
kind = "function"
msl = "Table 6.4 math functions and the floating-point common functions of Table 6.1 (fast_ prefix: fast-math variant)"
decision = "numerics"
wgsl = "per numerics.toml row"
reason = "Accuracy, fast-math and precise decisions per function are the rows of numerics.toml (id = the function name without fast_)."
probe = ["math_acos_f", "math_acos_h", "math_sin_f", "math_fma_f", "math_clamp_f", "math_ldexp_f", "math_sincos_f"]
cite = [
  { src = "msl", ref = "6.6", quote = "Table 6.4. Math functions in the Metal standard library" },
  { src = "msl", ref = "6.3", quote = "Table 6.1. Common functions in the Metal standard library" },
  { measure = "air-probe", case = "math_acos_f", quote = "air.fast_acos.f32" },
]

[[family]]
id = "math-geometric"
match = ['air\.(?:fast_)?(?:dot|distance|distance_squared|length|length_squared|normalize|cross|reflect|refract|faceforward)(?:\.(?:v\d+)?(?:f16|f32))+', 'air\.dot']
kind = "function"
msl = "Table 6.11 geometric functions"
decision = "numerics"
wgsl = "per numerics.toml row"
reason = "Rows dot, cross, length, distance, normalize, reflect (polyfill: MSL normalizes N), refract and faceforward of numerics.toml."
probe = ["geom_dot", "geom_length", "geom_normalize"]
cite = [
  { src = "msl", ref = "6.9", quote = "Table 6.11. Geometric functions in the Metal standard library" },
  { measure = "air-probe", case = "geom_dot", quote = "air.dot.v4f32" },
]

[[family]]
id = "math-not-in-msl"
match = ['air\.(?!(?:.*\.)?(?:v\d+)?f64(?:\.|$))(?:fast_|half_|native_)?(?:acospi|asinpi|atanpi|atan2pi|cbrt|erf|erfc|expm1|hypot|lgamma|lgamma_r|log1p|logb|remainder|remquo|rootn|pown|tgamma|mad)(?:\..*)?',
         'air\.(?:half|native)_(?:cos|sin|tan|exp|exp2|exp10|log|log2|log10|powr|rsqrt|sqrt)']
kind = "function"
msl = "none"
decision = "not-from-msl"
wgsl = "none"
reason = "OpenCL-style math entry points of the shared front end. MSL's math table defines none of them and no system metallib calls them."
cite = [
  { src = "msl", ref = "6", absent = '\b(acospi|asinpi|atanpi|atan2pi|cbrt|erfc?|expm1|hypot|lgamma|lgamma_r|log1p|logb|remainder|remquo|rootn|pown|tgamma|native_(cos|sin|exp|log|sqrt)|half_(cos|sin|exp|log|sqrt))\(' },
]

[[family]]
id = "integer"
match = ['air\.(?:abs|abs_diff|add_sat|clamp|hadd|mad_hi|mad_sat|max|max3|median3|min|min3|mul_hi|rhadd|sub_sat|mad24|mul24|extract_bits|insert_bits)\.[su](?:\.(?:v\d+)?i(?:8|16|32|64))?',
         'air\.(?:clz|ctz|popcount|reverse_bits|rotate)(?:\.(?:v\d+)?i(?:8|16|32|64))?',
         'air\.(?:abs|abs_diff|add_sat|hadd|mad_hi|mad_sat|max|max3|median3|min|min3|mul_hi|rhadd|sub_sat|mad24|mul24|extract_bits|insert_bits)']
kind = "function"
msl = "Table 6.2 integer functions"
decision = "lowering"
owner = "S5"
wgsl = "i32/u32 arithmetic and the integer built-ins of WGSL 17.5 (countLeadingZeros, countTrailingZeros, countOneBits, reverseBits, extractBits, insertBits, min, max, clamp, abs) where their definition matches; 8- and 16-bit forms re-wrapped, 64-bit forms as vec2<u32> (plan 5.2)"
reason = "Integer operations are exact in both languages; the forms WGSL lacks (absdiff, addsat, hadd, rhadd, mulhi, madhi, madsat, subsat, rotate, mul24, mad24, max3, min3, median3) are exact integer sequences. Each function's definition is matched against its MSL Table 6.2 entry by S5."
probe = ["int_clz_i32s", "int_absdiff_i32s", "int_mul24_i32s", "int_mad24_i32u", "int_extract_bits_i32u"]
cite = [
  { src = "msl", ref = "6.4", quote = "Table 6.2. Integer functions in the Metal standard library" },
  { src = "wgsl", ref = "#countLeadingZeros-builtin", quote = "countLeadingZeros" },
  { measure = "air-probe", case = "int_clz_i32s", quote = "air.clz.i32" },
]

[[family]]
id = "relational"
match = ['air\.(?:all|any)(?:\.v\d+i1)?']
kind = "function"
msl = "Table 6.3 relational functions all and any (the others lower to plain comparisons)"
decision = "native"
wgsl = "all, any"
reason = "Both reduce a boolean vector with logical and/or."
probe = ["rel_all", "rel_any"]
cite = [
  { src = "msl", ref = "6.5", quote = "Table 6.3. Relational functions in the Metal standard library" },
  { src = "wgsl", ref = "#all-builtin", quote = "17.3.1. all" },
  { measure = "air-probe", case = "rel_all", quote = "air.all.v4i1" },
]

[[family]]
id = "conversion"
match = ['air\.convert(?:\.[fsu]\.(?:v\d+)?(?:f16|f32|i1|i8|i16|i32|i64)\.[fsu]\.(?:v\d+)?(?:f16|f32|i1|i8|i16|i32|i64))?']
kind = "function"
msl = "static_cast and implicit conversions (2.23, 2.24, 8.6)"
decision = "lowering"
owner = "S5"
wgsl = "value constructors plus explicit NaN and rounding handling"
reason = "Rules and lowering in numerics.toml question 5.3-conversions."
probe = ["conv_f2s", "conv_s2f", "conv_l2f"]
cite = [
  { src = "msl", ref = "2.23", quote = "The static_cast operator converts from a scalar or vector type to another scalar or vector type using the default rounding mode with no saturation" },
  { measure = "air-probe", case = "conv_f2s", quote = "air.convert.s.i32.f.f32" },
]

[[family]]
id = "conversion-explicit-rounding"
match = ['air\.convert\.[fsu]\.(?:v\d+)?(?:f16|f32|i1|i8|i16|i32|i64)\.[fsu]\.(?:v\d+)?(?:f16|f32|i1|i8|i16|i32|i64)(?:\.rt[enpz](?:\.sat)?|\.sat)']
kind = "function"
msl = "none"
decision = "not-from-msl"
wgsl = "none"
reason = "Conversions with an explicit rounding mode or saturation are front-end entries for OpenCL-style convert_T_rtX_sat; MSL's static_cast has neither, and no system metallib uses them."
cite = [
  { src = "msl", ref = "2.23", quote = "with no saturation" },
  { src = "msl", ref = "6", absent = '\bconvert_\w+_rt[enpz]' },
]

[[family]]
id = "pack-unpack"
match = ['air\.(?:un)?pack\.[a-z0-9]+(?:\.[a-z0-9]+)*', 'air\.(?:un)?pack']
kind = "function"
msl = "6.15 pack and unpack functions"
decision = "lowering"
owner = "S5"
wgsl = "pack4x8unorm, pack2x16snorm and the other 17.9/17.10 built-ins where the conversion rule matches; otherwise exact integer code"
reason = "MSL's pack and unpack conversions follow its normalized-integer rules (8.7.1); WGSL's pack built-ins state their own formulas, which S5 matches per function, falling back to exact integer code (e.g. rgb10a2, rgb565, srgb forms that WGSL lacks)."
probe = ["pack_pack_float_to_unorm4x8", "unpack_unpack_unorm4x8_to_float", "unpack_unpack_unorm565_to_float"]
cite = [
  { src = "msl", ref = "6.15", quote = "6.15 Pack and Unpack Functions" },
  { src = "wgsl", ref = "#pack-builtin-functions", quote = "17.9. Data Packing Built-in Functions" },
]

# ---------------------------------------------------------------- fragment and stage functions

[[family]]
id = "derivative"
match = ['air\.(?:dfdx|dfdy|fwidth)(?:\.(?:v\d+)?f(?:16|32))?']
kind = "function"
msl = "Table 6.19 dfdx, dfdy, fwidth"
decision = "native"
wgsl = "dpdxFine, dpdyFine, fwidthFine"
reason = "MSL returns a high precision partial derivative, which is the fine variant; MSL states no accuracy bound and WGSL states an infinite ULP bound. Non-uniform control flow: numerics.toml question 5.3-derivative-uniformity."
probe = ["frag_dfdx_f", "frag_fwidth_h"]
cite = [
  { src = "msl", ref = "6.11.1.1", quote = "T dfdx(T p) Returns a high precision partial derivative of the specified value with respect to the screen space x coordinate." },
  { src = "wgsl", ref = "#dpdxFine-builtin", quote = "17.6.3. dpdxFine" },
  { measure = "air-probe", case = "frag_dfdx_f", quote = "air.dfdx.f32" },
]

[[family]]
id = "discard"
match = ['air\.discard_fragment']
kind = "function"
msl = "discard_fragment"
decision = "lowering"
owner = "S6b"
wgsl = "discard"
reason = "WGSL discard demotes to a helper invocation, MSL 2.3 and later's rule; for MSL 2.2 and earlier, intrinsics.toml question 5.6-discard."
probe = ["frag_discard"]
cite = [
  { src = "msl", ref = "6.11.1.3", quote = "void discard_fragment(void) Marks the current fragment as terminated and discards this fragment's output of the fragment function." },
  { src = "wgsl", ref = "#discard-statement", quote = "A discard statement converts the invocation into a helper invocation and throws away the fragment output." },
  { measure = "air-probe", case = "frag_discard", quote = "air.discard_fragment" },
]

[[family]]
id = "sample-queries"
match = ['air\.get_num_samples(?:\.i32)?', 'air\.get_sample_position(?:\..*)?']
kind = "function"
msl = "Table 6.20 get_num_samples, get_sample_position"
decision = "lowering"
owner = "S6b"
wgsl = "executor-provided values: the attachment sample count, and positions from the standard pattern"
reason = "WGSL has no query for the framebuffer sample count or sample positions. The count is per-pipeline state the executor passes; positions are WebGPU's standard pattern, which equals Metal's default for count 4 (limits.toml question 6.4-sample-positions-4x); counts other than 1 and 4 are refused at pipeline creation."
probe = ["frag_num_samples", "frag_sample_position"]
cite = [
  { src = "msl", ref = "6.11.1.2", quote = "Table 6.20. Samples fragment functions in the Metal standard library" },
  { measure = "air-probe", case = "frag_num_samples", quote = "air.get_num_samples" },
]

[[family]]
id = "pull-model-interpolation"
match = ['air\.interpolate_(?:center|centroid|offset|sample)_(?:no_)?perspective(?:\..*)?', 'air\.interpolant_type', 'air\.interpolation_function']
kind = "function"
msl = "6.12 pull-model interpolation (interpolant<T, P>)"
decision = "refusal"
wgsl = "none"
reason = "WGSL interpolates inputs only by their declared @interpolate attribute; it has no function to interpolate at a chosen sample, offset or centroid. Whether the A10X accepts pull-model interpolation is a device question (intrinsics.toml question 5.3-interpolate-at)."
probe = ["frag_interpolant"]
cite = [
  { src = "msl", ref = "6.12", quote = "All OS: Metal 2.3 and later support pull-model interpolation." },
  { src = "wgsl", ref = "#builtin-functions", absent = '\binterpolateAt' },
  { measure = "air-probe", case = "frag_interpolant", quote = "air.interpolate_center_perspective.v2f32" },
]

# ---------------------------------------------------------------- textures

[[family]]
id = "texture-sample"
match = ['air\.sample_(?:texture|depth)_(?:1d_array|1d|2d_ms_array|2d_ms|2d_array|2d|3d|cube_array|cube)(?:_grad)?(?:\.[a-z0-9]+)*',
         'air\.sample_compare_(?:texture|depth)_(?:1d_array|1d|2d_ms_array|2d_ms|2d_array|2d|3d|cube_array|cube)(?:_grad)?(?:\.[a-z0-9]+)*',
         'air\.sample_texture', 'air\.sample_depth', 'air\.sample_compare_']
kind = "function"
msl = "texture sample and sample_compare member functions (6.13)"
decision = "lowering"
owner = "S6a"
wgsl = "textureSample, textureSampleLevel, textureSampleBias, textureSampleGrad, textureSampleCompare, textureSampleCompareLevel"
reason = "Plan section 5.7 rows: offsets native; min-LOD clamp, bias range and compare with LOD by the stated emulations or Refusal; 1D arrays as 2D arrays; vertex and compute stages sample with an explicit level in both languages (question 5.7-sample-outside-fragment)."
probe = ["tex_sample_2d", "tex_sample_2d_implicit", "tex_sample_2d_options", "tex_sample_compare_depth_2d"]
cite = [
  { src = "msl", ref = "6.13", quote = "Overloaded variants of the texture sample and sample_compare functions with an lod_options argument are available" },
  { src = "wgsl", ref = "#texturesamplelevel", quote = "17.7.13. textureSampleLevel" },
  { measure = "air-probe", case = "tex_sample_2d", quote = "air.sample_texture_2d.v4f32" },
]

[[family]]
id = "texture-read-write"
match = ['air\.(?:read|write)_(?:texture|depth)_(?:1d_array|1d|2d_ms_array|2d_ms|2d_array|2d|3d|cube_array|cube|buffer_1d)(?:\.[a-z0-9]+)*',
         'air\.(?:read|write)_(?:texture|depth)']
kind = "function"
msl = "texture read and write member functions (6.13)"
decision = "lowering"
owner = "S6a"
wgsl = "textureLoad, textureStore"
reason = "Read-only and write-only access map to textureLoad on sampled or read-only storage textures and textureStore on write-only storage textures; formats that are not storage-capable on the host are LOUD at pipeline creation; texture buffers go through the memory model (plan 5.7). access::read_write is above the A10X's family (family texture-fence)."
probe = ["tex_read_2d", "tex_write_2d", "tex_read_2d_ms", "tex_buffer"]
cite = [
  { src = "msl", ref = "2.9", quote = "read — Without a sampler, a graphics or kernel function can only read the texture object." },
  { src = "wgsl", ref = "#textureload", quote = "17.7.4. textureLoad" },
  { src = "wgsl", ref = "#texturestore", quote = "17.7.15. textureStore" },
  { measure = "air-probe", case = "tex_read_2d", quote = "air.read_texture_2d.v4f32" },
]

[[family]]
id = "texture-gather"
match = ['air\.gather(?:_compare)?_(?:texture|depth)_(?:2d_array|2d|cube_array|cube)(?:\.[a-z0-9]+)*', 'air\.gather_texture', 'air\.gather_depth', 'air\.gather_compare_depth']
kind = "function"
msl = "texture gather and gather_compare member functions (6.13)"
decision = "lowering"
owner = "S6a"
wgsl = "textureGather, textureGatherCompare"
reason = "Component selection and offsets map directly; depth gather returns depth values in both (formats.toml question 5.5-depth-texture-as-color)."
probe = ["tex_gather_2d", "tex_gather_compare_depth_2d"]
cite = [
  { src = "wgsl", ref = "#texturegather", quote = "17.7.2. textureGather" },
  { measure = "air-probe", case = "tex_gather_2d", quote = "air.gather_texture_2d.v4f32" },
]

[[family]]
id = "texture-query"
match = ['air\.get_(?:width|height|depth|array_size|num_mip_levels|num_samples)_(?:texture|depth)_(?:1d_array|1d|2d_ms_array|2d_ms|2d_array|2d|3d|cube_array|cube|buffer_1d)',
         'air\.get_(?:width|height|depth|array_size|num_mip_levels|num_samples)_']
kind = "function"
msl = "texture get_width, get_height, get_depth, get_array_size, get_num_mip_levels, get_num_samples (6.13)"
decision = "lowering"
owner = "S6a"
wgsl = "textureDimensions, textureNumLayers, textureNumLevels, textureNumSamples"
reason = "Queries map to the WGSL queries; 1D textures stored as 2D report height 1 only through the 2D query, which the lowering does not expose; texture buffers report the element count the executor binds."
probe = ["tex_query_2d", "tex_read_2d_ms"]
cite = [
  { src = "wgsl", ref = "#texturedimensions", quote = "17.7.1. textureDimensions" },
  { measure = "air-probe", case = "tex_query_2d", quote = "air.get_width_texture_2d" },
]

[[family]]
id = "texture-lod-query"
match = ['air\.calculate_(?:clamped|unclamped)_lod_(?:texture|depth)_[a-z0-9_]+', 'air\.calculate_(?:clamped|unclamped)_lod_']
kind = "function"
msl = "calculate_clamped_lod and calculate_unclamped_lod (6.13)"
decision = "device-unsupported"
wgsl = "none"
reason = "Apple's family tables list texture LOD queries from Apple8; the A10X reports supportsQueryTextureLOD = 0 (plan 2.7)."
probe = ["tex_calculate_lod"]
cite = [
  { src = "mfst", quote = "Query texture LOD 8 Metal 3 & 4 Apple8" },
  { measure = "air-probe", case = "tex_calculate_lod", quote = "air.calculate_clamped_lod_texture_2d" },
]

[[family]]
id = "texture-fence"
match = ['air\.fence_(?:texture|depth)(?:_[a-z0-9_]+)?']
kind = "function"
msl = "texture fence() for access::read_write textures (6.13.17)"
decision = "device-unsupported"
wgsl = "none"
reason = "fence() exists only for read_write textures, which Apple's family tables list from Apple4 (A10X: Apple3)."
probe = ["tex_read_write_2d"]
cite = [
  { src = "msl", ref = "6.13.17", quote = "Texture types (including texture buffers) that you can declare with the access::read_write attribute support the fence function." },
  { src = "mfst", quote = "Read/write textures in functions Metal 3 & 4 Apple4" },
]

[[family]]
id = "texture-null"
match = ['air\.(?:is_null|get_null)_(?:texture|depth)_(?:1d_array|1d|2d_ms_array|2d_ms|2d_array|2d|3d|cube_array|cube|buffer_1d)']
kind = "function"
msl = "is_null_texture (6.13.18) and null texture handles"
decision = "emulation"
plan = "5.7 (air.get_null_texture*, is_null_texture row)"
wgsl = "none"
reason = "WebGPU has no null binding; the handle test is done on the executor-provided null flag, with a dummy texture bound."
probe = ["tex_null"]
cite = [
  { src = "msl", ref = "6.13.18", quote = "If the texture is a null texture, is_null_texture returns true; otherwise, return false" },
  { measure = "air-probe", case = "tex_null", quote = "air.is_null_texture_2d" },
]

[[family]]
id = "texture-atomic"
match = ['air\.atomic_[a-z_]+_explicit_(?:texture|depth)_[a-z0-9_]+(?:\.[a-z0-9]+)*', 'air\.atomic_compare_exchange_weak_explicit_']
kind = "function"
msl = "texture atomic member functions"
decision = "device-unsupported"
wgsl = "none"
reason = "Apple's family tables list texture atomics from Apple6."
cite = [
  { src = "mfst", quote = "Texture atomics Metal 3 & 4 Apple6" },
]

[[family]]
id = "texture-not-in-msl"
match = ['air\.get_channel_(?:data_type|order)_(?:[a-z0-9_]+)?', 'air\.get_unique_id_(?:texture|depth)', 'air\.get_unique_identifier_(?:(?:texture|depth)_[a-z0-9_]+|sampler|command_buffer|compute_pipeline_state|render_pipeline_state)?', 'air\.get_unique_identifier']
kind = "function"
msl = "none"
decision = "not-from-msl"
wgsl = "none"
reason = "Image channel queries and unique-identifier queries are front-end entries that the MSL specification does not define and no system metallib calls."
