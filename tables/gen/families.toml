[[family]]
id = "simdgroup-attributes"
match = ['air\.(?:threads_per_simdgroup|thread_index_in_simdgroup|simdgroup_index_in_threadgroup|simdgroups_per_threadgroup|threads_per_quadgroup|thread_index_in_quadgroup|quadgroup_index_in_threadgroup|quadgroups_per_threadgroup|thread_execution_width|simdgroup_size|dispatch_simdgroups_per_threadgroup|dispatch_quadgroups_per_threadgroup)']
kind = "metadata"
msl = "SIMD-group and quad-group index attributes (5.2.3.6)"
decision = "open"
wgsl = "subgroup_size and subgroup_invocation_id need the subgroups feature and report the host's subgroup size"
reason = "These attributes describe the device's SIMD-group partition (width 32 on the A10X per D1). WGSL can expose a host subgroup partition only with the subgroups feature and a host-chosen size, and MSL does not define how threads are grouped into SIMD-groups, so an exact lowering needs that grouping established (by measurement on the device) or the attributes are refused."
probe = ["module-metadata"]
cite = [
  { src = "msl", ref = "5.2.3.6", quote = "Table 5.8. Attributes for kernel function input arguments" },
  { src = "wgsl", ref = "#enable-extensions-sec", quote = "subgroups" },
  { measure = "air-probe", case = "module-metadata", quote = "air.threads_per_simdgroup" },
]

[[family]]
id = "visible-stitchable"
match = ['air\.(?:visible|visible_input|visible_output|visible_padding|visible_function_reference|visible_function_references|signature|module_signature|linked_constants_signature|stitching_argument|stitching_info|stitching_type)']
kind = "metadata"
msl = "visible and stitchable functions (5.1.4, 5.1.5)"
decision = "lowering"
owner = "S3"
wgsl = "none needed: directly called visible functions are linked and inlined"
reason = "MSL lets functions call visible functions directly, the callee being supplied with the pipeline; stitchable functions are visible functions with extra metadata for the stitching graph. Canonicalization links and inlines them (plan 5.1 stage 5); calls through function pointers or tables are the separate family function-tables-dynamic."
cite = [
  { src = "msl", ref = "5.1.4", quote = "It is legal for other functions to directly call a visible function." },
  { src = "msl", ref = "5.1.5", quote = "The [[stitchable]] attribute implies [[visible]], which means that stitchable functions can be used in all contexts where a visible function can be used as described in Sec 5.1.4." },
]
