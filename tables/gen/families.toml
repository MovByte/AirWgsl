  { src = "msl", ref = "6", absent = '\bget_channel_(data_type|order)\b|\bget_unique_identifier\b|\bget_resource_id\b' },
]

# ---------------------------------------------------------------- atomics and synchronization

[[family]]
id = "atomic-int32"
match = ['air\.atomic\.(?:global|local)\.(?:add|sub|and|or|xor|min|max|xchg|cmpxchg\.weak|load|store)\.[su]\.i32',
         'air\.atomic\.(?:global|local)\.(?:add|sub|and|or|xor|min|max|xchg|cmpxchg\.weak|load|store)\.i32',
         'air\.atomic', 'air\.atomic\.global']
kind = "function"
msl = "32-bit atomic functions on device and threadgroup memory (6.16)"
decision = "lowering"
owner = "S6d"
wgsl = "atomicLoad, atomicStore, atomicAdd, atomicSub, atomicAnd, atomicOr, atomicXor, atomicMin, atomicMax, atomicExchange, atomicCompareExchangeWeak"
reason = "Plan section 5.8: the region is declared array<atomic<u32>> and MSL's relaxed order is refined by WGSL's ordering."
probe = ["atomic_fetch_add_int_device", "atomic_fetch_add_uint_threadgroup", "atomic_cmpxchg_device", "atomic_load_store_device"]
cite = [
  { src = "msl", ref = "6.16.4.5", quote = "Table 6.27. Atomic operations" },
  { src = "wgsl", ref = "#atomic-rmw", quote = "17.8.3. Atomic Read-modify-write Arithmetic and Logical Functions" },
  { measure = "air-probe", case = "atomic_fetch_add_int_device", quote = "air.atomic.global.add.s.i32" },
]

[[family]]
id = "atomic-float"
match = ['air\.atomic\.(?:global|local)\.[a-z.]+\.f32']
kind = "function"
msl = "atomic_float"
decision = "device-unsupported"
wgsl = "none"
reason = "Floating-point atomics are listed from Apple7; the A10X reports supportsAtomicFloat = 0 (plan 2.7)."
probe = ["atomic_float_add_device"]
cite = [
  { src = "mfst", quote = "Floating-point atomics Metal 3 & 4 Apple7" },
  { measure = "air-probe", case = "atomic_float_add_device", quote = "air.atomic.global.add.f32" },
]

[[family]]
id = "atomic-int64"
match = ['air\.atomic\.(?:global|local)\.[a-z.]+\.(?:[su]\.)?i64']
kind = "function"
