t81 = "x / y"
t82 = "x / y"
t83 = "x / y"
wgsl = "x / y"
fast_f32 = "native"
fast_f32_analysis = "MSL: at most 2.5 ulp for y in [2^-126, 2^126]. WGSL: 2.5 ULP for |y| in [2^-126, 2^126], which contains MSL's domain. Equal bound."

