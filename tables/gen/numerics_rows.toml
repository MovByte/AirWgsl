t83 = "acos(x)"
wgsl = "acos(x)"
fast_f32 = "polyfill"
fast_f32_analysis = "MSL: at most 5 ulp on [-1, 1]. WGSL: the worse of an absolute error of 6.77e-5 and the atan2-based formula, which is far looser than 5 ulp for small results."

[[row]]
