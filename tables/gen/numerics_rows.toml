t81 = "1.0 / x"
t82 = "1.0 / x"
t83 = "1.0 / x"
wgsl = "x / y"
fast_f32 = "polyfill"
fast_f32_analysis = "MSL: at most 1 ulp for x in [2^-126, 2^126]. WGSL has only division, at most 2.5 ULP: looser."

[[row]]
id = "div"
msl = "x / y"
