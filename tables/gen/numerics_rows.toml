id = "tanh"
msl = "tanh"
def = { src = "msl", ref = "6.6", quote = "T tanh(T x) Compute hyperbolic tangent of x." }
t81 = "tanh"
t82 = "tanh(x)"
t83 = "tanh(x)"
wgsl = "tanh(x)"
fast_f32 = "polyfill"
fast_f32_analysis = "MSL fast tanh is (t - 1)/(t + 1) with t = exp(2x). WGSL: the worse of an absolute error of 1e-5 and sinh(x)/cosh(x): looser."

[[row]]
id = "tanpi"
msl = "tanpi"
def = { src = "msl", ref = "6.6", quote = "T tanpi(T x) Compute tan(πx)." }
t81 = "tanpi"
t82 = "tanpi(x)"
t83 = "tanpi(x)"
fast_f32 = "polyfill"
fast_f32_analysis = "MSL fast tanpi is tan(x * pi); WGSL has no tanpi. Evaluate with the tan polyfill."

[[row]]
id = "trunc"
msl = "trunc"
def = { src = "msl", ref = "6.6", quote = "T trunc(T x) Round x to integral value using the round toward zero rounding mode." }
t81 = "trunc"
t82 = "trunc"
t83 = "trunc"
wgsl = "trunc(x)"
fast_f32 = "native"
fast_f32_analysis = "Exact in both (rule R2)."

[[row]]
id = "clamp"
msl = "clamp"
def = { src = "msl", ref = "6.3", quote = "T clamp(T x, T minval, T maxval) Returns fmin(fmax(x, minval), maxval). Results are undefined if minval > maxval." }
wgsl = "clamp(x,low,high)"
fast_f32 = "native"
fast_f32_analysis = "Exact selections; WGSL's two formulations differ only when low > high, where MSL is undefined."

[[row]]
id = "mix"
msl = "mix"
def = { src = "msl", ref = "6.3", quote = "T mix(T x, T y, T a) Returns the linear blend of x and y implemented as: x + (y – x) * a or: (1 -a) * x + a * y" }
wgsl = "mix(x, y, z)"
fast_f32 = "native"
fast_f32_analysis = "MSL states no accuracy bound and allows (1 - a) * x + a * y, which is WGSL's inherited formula; a outside [0, 1] is undefined in MSL."

[[row]]
id = "saturate"
msl = "saturate"
def = { src = "msl", ref = "6.3", quote = "T saturate(T x) Clamp the specified value within the range of 0.0 to 1.0." }
wgsl = "saturate(x)"
fast_f32 = "native"
fast_f32_analysis = "Exact selection in both."

[[row]]
id = "sign"
msl = "sign"
def = { src = "msl", ref = "6.3", quote = "T sign(T x) Returns 1.0 if x > 0, -0.0 if x = -0.0, +0.0 if x = +0.0, or -1.0 if x < 0. Returns 0.0 if x is a NaN." }
wgsl = "sign(x)"
fast_f32 = "native"
fast_f32_analysis = "Equal for non-zero non-NaN inputs; under fast math MSL lets the sign of zero be ignored and NaN is undefined (1.6.3, 8.1)."

[[row]]
id = "smoothstep"
msl = "smoothstep"
def = { src = "msl", ref = "6.3", quote = "t = clamp((x – edge0)/(edge1 – edge0), 0, 1); return t * t * (3 – 2 * t);" }
wgsl = "smoothstep(edge0, edge1, x)"
fast_f32 = "native"
fast_f32_analysis = "MSL states no accuracy bound and the same formula as WGSL; edge0 >= edge1 is undefined in MSL."

[[row]]
id = "step"
msl = "step"
def = { src = "msl", ref = "6.3", quote = "T step(T edge, T x) Returns 0.0 if x < edge; otherwise, it returns 1.0." }
wgsl = "step(edge, x)"
fast_f32 = "native"
fast_f32_analysis = "Exact in both."

[[row]]
id = "dot"
msl = "dot"
def = { src = "msl", ref = "6.9", quote = "Ts dot(T x, T y) Return the dot product of x and y, which is x[0] * y[0] + x[1] * y[1] + …" }
wgsl = "dot(x, y)"
fast_f32 = "native"
fast_f32_analysis = "MSL states no accuracy bound for dot; WGSL's bound (the sum of products) is a stated bound, so it is at least as tight."

