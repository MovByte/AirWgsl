fast_f32_analysis = "Both define atanh as 0.5 times log((1 + x) / (1 - x)) (the factor 0.5 is exact). The components have equal stated bounds: WGSL log (2^-21 absolute on [0.5, 2], 3 ULP elsewhere) equals MSL fast log, WGSL division (2.5 ULP) equals MSL fast division, and add/subtract carry the same magnitude bound below 1 ulp under rule R3."

