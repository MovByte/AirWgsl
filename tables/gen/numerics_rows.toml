# One row per MSL floating-point builtin and operator. gen_numerics.py fills in the
# accuracy cells verbatim from MSL Tables 8.1-8.3 (labels t81, t82, t83) and from the
# WGSL accuracy table (label wgsl), and adds the generic decisions for precise math and
# half precision. The fast-math single-precision decision is stated here with the
# comparison that supports it, under the rules in [rules] of numerics.toml.
#
# Decisions: native = the WGSL operation's stated accuracy is at least as tight as
# MSL's over MSL's domain; polyfill = emit an implementation whose accuracy meets the
# MSL bound (S5 owns its error analysis); soft-float = the integer IEEE library.

[[row]]
id = "add"
msl = "x + y"
def = { src = "msl", ref = "3.1", quote = "The arithmetic binary operators, add (+), subtract (–), multiply (*) and divide (/), act upon scalar and vector, integer, and floating-point data type operands." }
t81 = "x + y"
t82 = "x + y"
t83 = "x + y"
wgsl = "x + y"
fast_f32 = "polyfill"
fast_f32_analysis = "Both texts say correctly rounded, but MSL allows only round-to-nearest-even or round-toward-zero (8.2) while WGSL allows rounding up or down (15.7.4), so a native WGSL addition may return a value MSL does not allow. Exact only through integer soft-float in round-to-nearest-even."

[[row]]
id = "sub"
msl = "x - y"
def = { src = "msl", ref = "3.1", quote = "The arithmetic binary operators, add (+), subtract (–), multiply (*) and divide (/), act upon scalar and vector, integer, and floating-point data type operands." }
t81 = "x - y"
t82 = "x - y"
t83 = "x - y"
wgsl = "x - y"
fast_f32 = "polyfill"
fast_f32_analysis = "As for x + y: WGSL's correctly rounded result may round in a direction MSL's rounding modes do not allow (8.2 versus 15.7.4)."

