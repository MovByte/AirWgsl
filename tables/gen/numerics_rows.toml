wgsl = "acosh(x)"
fast_f32 = "polyfill"
fast_f32_analysis = "Both define acosh as log(x + sqrt(x*x - 1)), but MSL's sqrt is x * rsqrt(x) (rsqrt at most 2 ulp) while WGSL's sqrt inherits from 1.0 / inverseSqrt(x) (2 ULP plus a 2.5 ULP division): looser. Evaluate MSL's formula with the sqrt polyfill."

