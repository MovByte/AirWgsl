[package]
name = "airwgsl"
version = "0.1.0"
description = "AIR (Metal's LLVM bitcode) to WGSL compiler"
edition = "2024"
license = "BSD-2-Clause-Patent"

[lib]
path = "src/lib.rs"

[dev-dependencies]
naga = { version = "29", features = ["wgsl-in"] }
pollster = "0.4"
wgpu = { version = "29", default-features = false, features = ["metal", "wgsl"] }
